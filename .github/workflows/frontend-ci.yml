name: Frontend CI

on:
  push:
    branches: [new/changes, main]
    paths:
      - "3d-commerce/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "3d-commerce/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3d-commerce
    env:
      NODE_ENV: production
      BACKEND_API_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 3d-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
