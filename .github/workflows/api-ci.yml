name: API CI

on:
  push:
    branches: [new/changes, main]
    paths: ["3d-commerce-api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    paths: ["3d-commerce-api/**", ".github/workflows/api-ci.yml"]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3d-commerce-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: advfx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d advfx_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/advfx_test
      PORT: 3001
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-test-secret
      RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret
      AUTH_CAPTCHA_SECRET: ci-captcha-secret-012345678901234567890123
      AUTH_EXPOSE_DEV_TOKENS: "false"
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 3d-commerce-api/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: npm run build
