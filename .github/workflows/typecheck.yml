name: Typecheck

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            3d-commerce/package-lock.json
            3d-commerce-api/package-lock.json

      - name: Install frontend dependencies
        working-directory: 3d-commerce
        run: npm install --no-audit --no-fund

      - name: Check generated-source corruption
        run: |
          ! grep -rnE '\\\\n|/\\\\/' 3d-commerce/src 3d-commerce-api/src

      - name: Typecheck frontend
        working-directory: 3d-commerce
        run: npx tsc --noEmit

      - name: Install backend dependencies
        working-directory: 3d-commerce-api
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: 3d-commerce-api
        run: npx prisma generate

      - name: Typecheck backend
        working-directory: 3d-commerce-api
        run: npx tsc --noEmit
